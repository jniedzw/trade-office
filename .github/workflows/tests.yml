# Runs every test on GitHub whenever code is pushed, so a broken change shows up
# as a red cross on the repo instead of on a customer's phone.
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Made-up values: the app needs these to start, and the tests never reach
      # Twilio, the AI or anything real. Real secrets never go on GitHub.
      - run: pytest -q
        env:
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test-token
          TWILIO_API_KEY_SID: SKtest
          TWILIO_API_KEY_SECRET: test-secret
          PUBLIC_URL: https://example.test
